---
name: Run tests and package firmware
on:
  push:
    branches:
      - 'main'
      - '[0-9]+.[0-9]+'
    tags:
      - v*
    paths: &trigger-paths
      - '.github/workflows/actions.yml'
      - 'cmake/**'
      - 'radio/**'
      - 'tools/build-gh.sh'
      - '.gitmodules'
      - 'CMakeLists.txt'
  pull_request:
    branches:
      - 'main'
      - '[0-9]+.[0-9]+'
    paths: *trigger-paths

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x9dp2019
          - tx16s
          - nv14
          - el18
          - pl18
          - pl18ev
          - t12
          - t12max
          - t15
          - t16
          - t18
          - t8
          - tlite
          - t20
          - t14
          - t20v2
          - tx12
          - x10
          - x12s
          - x7
          - x9d
          - x9dp
          - x9e
          - x9lite
          - x9lites
          - xlite
          - xlites
          - mt12
          - gx12
          - nb4p
          - st16
    container:
      image: ghcr.io/edgetx/edgetx-dev:2.11
      volumes:
        - ${{ github.workspace }}:/src
      # Docker's default seccomp profile blocks the personality() call that
      # setarch -R needs (see the "Test" step).
      options: --security-opt seccomp=unconfined
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          submodules: recursive
          # fetch-depth: 0 # https://github.com/actions/checkout#Fetch-all-history-for-all-tags-and-branches

      - name: Show ASLR settings
        run: |
          echo "kernel: $(uname -r)"
          echo "vm.mmap_rnd_bits: $(cat /proc/sys/vm/mmap_rnd_bits)"
          echo "kernel.randomize_va_space: $(cat /proc/sys/kernel/randomize_va_space)"
          echo "personality under setarch -R: $(setarch "$(uname -m)" -R cat /proc/self/personality)"

      # gtests-radio is built with ASan. The 2.11 image's GCC 9 ASan runtime
      # can crash at startup on the runners' randomised memory layout, then
      # loop printing "AddressSanitizer:DEADLYSIGNAL" until the job times out.
      # Running with address randomisation disabled avoids that; child
      # processes, including gtests-radio, inherit the setting.
      - name: Test ${{ matrix.target }}
        timeout-minutes: 30
        env:
          FLAVOR: ${{ matrix.target }}
        run: |
          echo "Running commit tests"
          setarch "$(uname -m)" -R ./tools/commit-tests.sh


  build:
    name: Run builds
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - nv14;el18
          - pl18;pl18ev;pl18u
          - pa01
          - t12;t12max
          - t15;t16;t18
          - t8;zorro;pocket;mt12;commando8
          - tlite;tpro;tprov2;tpros;bumblebee;lr3pro
          - t20;t20v2;t14
          - tx12;tx12mk2;boxer;gx12
          - tx16s
          - f16
          - v14;v16
          - x10;x10express
          - x12s
          - x7;x7access
          - x9d;x9dp;x9dp2019
          - x9e;x9e-hall
          - x9lite;x9lites
          - xlite;xlites
          - mt12;gx12
          - nb4p
          - st16
    container:
      image: ghcr.io/edgetx/edgetx-dev:2.11
      volumes:
        - ${{ github.workspace }}:/src
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build ${{ matrix.target }}
        env:
          FLAVOR: ${{ matrix.target }}
        run: |
          echo "Running firmware build"
          ./tools/build-gh.sh

      - name: Upload ${{ matrix.target }}
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.target }}
          path: |
            fw.json
            LICENSE
            *.bin
            *.uf2
          retention-days: 15
          if-no-files-found: error

  package:
    name: Package firmwares
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Compose release filename
        # https://stackoverflow.com/questions/58033366/how-to-get-current-branch-within-github-actions
        run: echo "artifact_name=edgetx-firmware-${GITHUB_REF##*/}" >> $GITHUB_ENV

      - name: Merge firmware artifact packages
        uses: actions/upload-artifact/merge@v7
        with:
          name: "${{ env.artifact_name }}"
          pattern: firmware-*
          delete-merged: true
          retention-days: 15
