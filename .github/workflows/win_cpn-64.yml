name: Windows Companion 64-bit

on:
  workflow_call:
  workflow_dispatch:

env:
  CMAKE_GENERATOR: "Ninja"
  QT_VERSION: "5.15.2"
  QT_ARCH: "win64_msvc2019_64"
  SDL2_VERSION: "2.32.10"
  # LLVM's clang targeting the MSVC ABI, with the Visual Studio headers and libs
  CXX: "clang++"
  CC: "clang"

jobs:
  build:
    # The CMake configure and build commands are platform agnostic and should work equally
    # well on Windows or Mac.  You can convert this to a matrix build if you need
    # cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: windows-2022
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        run: python -m pip install --upgrade pip clang jinja2 lz4 pillow

      - name: Install Qt
        uses: jdpurcell/install-qt-action@v5
        env:
          AQT_CONFIG: ${{ github.workspace }}/tools/aqt-settings.ini
        with:
          cache: true
          cache-key-prefix: 'install-qt-action-${{ env.QT_ARCH }}'
          version: ${{ env.QT_VERSION }}
          arch: ${{ env.QT_ARCH }}
          # Python 3.12 above already has the codegen packages, another
          # interpreter on PATH would shadow it
          setup-python: 'false'

      - name: Setup SDL2
        run: |
          archive="SDL2-devel-${SDL2_VERSION}-VC.zip"
          curl -fsSL -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/libsdl-org/SDL/releases/download/release-${SDL2_VERSION}/${archive}"
          unzip -q "${RUNNER_TEMP}/${archive}" -d "${RUNNER_TEMP}/SDL2"
          echo "SDL2_ROOT=${RUNNER_TEMP}/SDL2/SDL2-${SDL2_VERSION}" >> "${GITHUB_ENV}"

      # The simulator uses pthreads, which MSVC doesn't provide
      - name: Install pthreads4w
        run: |
          "$(cygpath -u "${VCPKG_INSTALLATION_ROOT}")/vcpkg.exe" install pthreads:x64-windows
          echo "PTHREADS4W_ROOT=${VCPKG_INSTALLATION_ROOT}/installed/x64-windows" >> "${GITHUB_ENV}"

      - name: Setup MSVC
        shell: pwsh
        run: .github/scripts/setup-msvc.ps1

      - name: Install NSIS
        uses: repolevedavaj/install-nsis@v1
        with:
          nsis-version: '3.11'

      - name: Build
        working-directory: ${{github.workspace}}
        # Execute the build.  You can specify a specific target with "--target <NAME>"
        run: |
          mkdir output && \
          CMAKE_PREFIX_PATH="$QT_ROOT_DIR;$SDL2_ROOT;$PTHREADS4W_ROOT" \
          tools/build-companion.sh "$(pwd)" "$(pwd)/output/"

      - name: Compose release filename
        # https://stackoverflow.com/questions/58033366/how-to-get-current-branch-within-github-actions
        run: echo "artifact_name=edgetx-cpn-win64-${GITHUB_REF##*/}" >> $GITHUB_ENV

      - name: Archive production artifacts
        uses: actions/upload-artifact@v7
        with:
          name: "${{ env.artifact_name }}"
          path:  ${{github.workspace}}/output
          retention-days: 15
